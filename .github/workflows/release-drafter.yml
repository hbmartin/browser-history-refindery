name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-release-draft:
    name: Update draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Required to create and update the draft release.
      pull-requests: read # Required to compile merged pull request details.
    steps:
      - name: Update the draft release
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
